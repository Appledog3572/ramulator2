# r2_ttl_config.yaml — ttl_theta_experiment 專用的 Ramulator2 組態
#
# 與 r2_data_layer_config.yaml 的唯一差別：**多載入 ECC plugin**。
# 另存新檔而不是直接改原檔，是為了不動到組員 E1–E4 既有的執行環境。
#
# 為什麼需要：Step 7 的交叉驗證與 F16 都含 A4（ECC）臂，
# 而原本的組態只有 DataLayer，跑到 ECC 臂就會拋
#   `RamulatorRAM: ECC plugin not ready (use_ecc=true but ECC plugin missing)`
#
# DDR4 時序與 org 全部沿用原檔，未做任何更動。

frontend:
  impl: NullFrontend
memory_system:
  impl: GenericDRAM
  clock_ratio: 3
  channel_mapper:
    impl: PassThroughChannelMapper
  controllers:
    - impl: GenericDDR
      wr_low_watermark: 0.2
      wr_high_watermark: 0.8
      read_buffer_size: 32
      write_buffer_size: 32
      priority_buffer_size: 1568
      scheduler:
        impl: FRFCFS
      refresh_manager:
        impl: NoRefresh
      row_policy:
        impl: Open
      addr_mapper:
        impl: RoBaRaCoCh
      dram:
        impl: DDR4
        org:
          dq: 8
          count: [1, 1, 4, 4, 65536, 1024]
        timing: [2400, 4, 16, 16, 16, 39, 55, 18, 9, 12, 4, 6, 4, 6, 3, 9, 26, 433, 9364, 2, 833]
        command_cycles: [1, 1, 1, 1, 1, 1, 1, 1]
        channel_width: 64
        read_latency: 20
        timing_constraints:
          - [0, [3, 5], [3, 5], 4]
          - [0, [4, 6], [4, 6], 4]
          - [1, [3, 5], [3, 5], 4]
          - [1, [4, 6], [4, 6], 4]
          - [1, [3, 5], [4, 6], 10]
          - [1, [4, 6], [3, 5], 19]
          - [1, [3, 5], [3, 4, 5, 6], 6, 1, true]
          - [1, [4, 6], [3, 5], 2, 1, true]
          - [1, [3], [2], 9]
          - [1, [4], [2], 34]
          - [1, [0], [0], 4]
          - [1, [0], [0], 26, 4]
          - [1, [0], [2], 39]
          - [1, [2], [0], 16]
          - [1, [0], [7], 55]
          - [1, [1, 2], [7], 16]
          - [1, [5], [7], 25]
          - [1, [6], [7], 50]
          - [1, [7], [0, 2], 433]
          - [2, [3, 5], [3, 5], 6]
          - [2, [4, 6], [4, 6], 6]
          - [2, [4, 6], [3, 5], 25]
          - [2, [0], [0], 6]
          - [3, [0], [0], 55]
          - [3, [0], [3, 4, 5, 6], 16]
          - [3, [0], [1], 39]
          - [3, [1], [0], 16]
          - [3, [3], [1], 9]
          - [3, [4], [1], 34]
          - [3, [5], [0], 25]
          - [3, [6], [0], 50]
      controller_plugins:
        - impl: DataLayer
          page_size: 4096
          debug: false
        # ── ECC 晶片（SEC-DED）──────────────────────────────────────────────
        # ttl_theta_experiment 的 A4 / A5 臂需要它：RamulatorRAM 的建構子在
        # use_ecc=true 時會呼叫 ecc_is_ready()，plugin 不在就直接 throw。
        #
        # 加上它**不會影響非 ECC 的實驗臂**：ECCPlugin 只實作 init()/setup()，
        # 沒有覆寫 IControllerPlugin 的 pre_schedule / on_issue / post_schedule，
        # 完全不碰 DRAM 控制器的排程與時序，純粹是個由 ecc_read/ecc_write
        # 明確驅動的旁路資料結構。而 use_ecc=false 時那兩個函式根本不會被呼叫。
        - impl: ECC
          debug: false
